<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-item svg{width:19px;height:19px;flex-shrink:0;}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1200px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}
  .btn-add{background:var(--amber);color:var(--ink);border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .inv-table{width:100%;border-collapse:collapse;}
  .inv-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);font-weight:600;padding:0 14px 10px;}
  .inv-row{background:var(--ink-raised);}
  .inv-row td{padding:14px;font-size:13.5px;border-top:1px solid var(--ink-line);}
  .inv-row:first-child td{border-top:none;}
  .prod-name{font-weight:700;}
  .prod-cat{font-size:11.5px;color:var(--chalk-dim);}
  .stock-badge{font-family:'IBM Plex Mono',monospace;padding:4px 10px;border-radius:999px;font-size:12px;}
  .stock-badge.low{background:rgba(200,53,46,.15);color:var(--barber-red);}
  .stock-badge.ok{background:rgba(78,154,99,.15);color:#4E9A63;}
  .price-cell{font-family:'IBM Plex Mono',monospace;}
  .restock-btn{background:transparent;border:1px solid var(--ink-line);color:var(--chalk-dim);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;}
  .inv-delete{cursor:pointer;color:var(--chalk-dim);font-size:14px;padding:7px;border-radius:6px;display:flex;align-items:center;}
  .inv-delete:hover{color:var(--barber-red);background:rgba(200,53,46,.12);}

  .table-wrap{background:transparent;border-radius:var(--radius);overflow:hidden;}

  /* Modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:60;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:14px;padding:24px;width:360px;max-width:90vw;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:16px;}
  .modal label{font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;}
  .modal input{width:100%;margin:6px 0 14px;padding:10px 12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:8px;}
  .modal-actions button{flex:1;padding:11px;border-radius:8px;cursor:pointer;font-size:13px;}
  .btn-cancel{background:var(--ink);border:1px solid var(--ink-line);color:var(--chalk-dim);}
  .btn-confirm{background:var(--amber);border:none;color:var(--ink);font-weight:700;}

  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
    .inv-table thead{display:none;}
    .inv-table, .inv-table tbody, .inv-row, .inv-row td{display:block;width:100%;}
    .inv-row{border-radius:12px;margin-bottom:10px;border:1px solid var(--ink-line);}
    .inv-row td{border-top:none;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  @media (max-width:480px){
    .app{grid-template-columns:50px 1fr;}
    .rail-logo{width:32px;height:32px;font-size:12px;margin-bottom:12px;}
    .rail-item{width:36px;height:36px;}
    .rail-item svg{width:16px;height:16px;}
    main{padding:16px 12px 40px;}
    .shop-name{font-size:22px !important;}
    .shop-sub{font-size:11px;}
  }
</style>
</head>
<body>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
      <a class="rail-item" href="pos.html" title="POS / New Sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a>
      <a class="rail-item" href="appointments.html" title="Appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a class="rail-item" href="queue.html" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="21" y2="6"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="12" x2="21" y2="12"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="18" x2="21" y2="18"/></svg></a>
      <a class="rail-item" href="customers.html" title="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
      <a class="rail-item" href="staff.html" title="Staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5c1.6.4 2.8 1.9 2.8 3.6 0 1.7-1.2 3.2-2.8 3.6"/><path d="M18.5 14.2c2.3.6 4 2.6 4 5"/></svg></a>
      <a class="rail-item active" href="inventory.html" title="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg></a>
      <a class="rail-item" href="reports.html" title="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="21" y1="20" x2="21" y2="4"/></svg></a>
      <a class="rail-item" href="expenses.html" title="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg></a>
      <a class="rail-item" href="settings.html" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">INVENTORY</div>
        <div class="shop-sub">Kinyozi Management System · products &amp; stock</div>
      </div>
      <button class="btn-add" onclick="openAddModal()">+ Add Product</button>
    </div>

    <div class="table-wrap">
      <table class="inv-table">
        <thead><tr><th>Product</th><th>Sell Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="invBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Restock modal -->
<div class="modal-overlay" id="restockModal">
  <div class="modal">
    <div class="modal-title">Restock Product</div>
    <div id="restockProdName" style="font-size:13px;color:var(--chalk-dim);margin-bottom:14px;"></div>
    <label>Quantity received</label>
    <input id="restockQty" type="number" min="1" placeholder="e.g. 10">
    <label>Unit cost (KSh)</label>
    <input id="restockCost" type="number" min="0" placeholder="e.g. 250">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeRestockModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitRestock()">Add Stock</button>
    </div>
  </div>
</div>

<!-- Add product modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">Add Product</div>
    <label>Name</label>
    <input id="addName" placeholder="e.g. Hair Wax">
    <label>Sell price (KSh)</label>
    <input id="addPrice" type="number" min="0" placeholder="e.g. 400">
    <label>Starting stock</label>
    <input id="addStock" type="number" min="0" placeholder="e.g. 10">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitAddProduct()">Add Product</button>
    </div>
  </div>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  let currentRestockId = null;

  function fmtKsh(n) { return 'KSh ' + Number(n).toLocaleString(); }

  function rowHTML(p) {
    const low = p.stock_quantity <= p.low_stock_threshold;
    const safeName = p.name.replace(/'/g,"\\'").replace(/"/g, '&quot;');
    return `
      <tr class="inv-row">
        <td><div class="prod-name">${escapeHtml(p.name)}</div><div class="prod-cat">${escapeHtml(p.category || 'Uncategorized')}</div></td>
        <td class="price-cell">${fmtKsh(p.sell_price)}</td>
        <td><span class="stock-badge ${low ? 'low' : 'ok'}">${p.stock_quantity} left</span></td>
        <td style="display:flex;gap:8px;">
          <button class="restock-btn" onclick="openRestockModal('${p.id}', '${safeName}')">Restock</button>
          <span class="inv-delete" title="Delete ${escapeHtml(p.name)}" onclick="deleteProduct('${p.id}','${safeName}')">🗑</span>
        </td>
      </tr>`;
  }

  async function deleteProduct(id, name) {
    if (!confirm(`Delete "${name}" from inventory? Past sales records are kept, it just won't appear in the catalog anymore.`)) return;
    await fetch(`${API_BASE}/inventory/products/${id}`, { method: 'DELETE' });
    loadInventory();
  }

  async function loadInventory() {
    const res = await fetch(`${API_BASE}/inventory/products?shop_id=${SHOP_ID}`);
    const products = await res.json();
    document.getElementById('invBody').innerHTML = products.map(rowHTML).join('') || `<tr><td colspan="4" style="padding:30px;text-align:center;color:var(--chalk-dim);">No products yet.</td></tr>`;
  }

  function openRestockModal(id, name) {
    currentRestockId = id;
    document.getElementById('restockProdName').textContent = name;
    document.getElementById('restockQty').value = '';
    document.getElementById('restockCost').value = '';
    document.getElementById('restockModal').classList.add('open');
  }
  function closeRestockModal() { document.getElementById('restockModal').classList.remove('open'); }

  async function submitRestock() {
    const qty = Number(document.getElementById('restockQty').value);
    const cost = Number(document.getElementById('restockCost').value) || 0;
    if (!qty || qty <= 0) return;
    await fetch(`${API_BASE}/inventory/purchases`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_id: SHOP_ID, items: [{ product_id: currentRestockId, quantity: qty, unit_cost: cost }] })
    });
    closeRestockModal();
    loadInventory();
  }

  function openAddModal() {
    document.getElementById('addName').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addStock').value = '';
    document.getElementById('addModal').classList.add('open');
  }
  function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

  async function submitAddProduct() {
    const name = document.getElementById('addName').value.trim();
    const price = Number(document.getElementById('addPrice').value);
    const stock = Number(document.getElementById('addStock').value) || 0;
    if (!name || !price) return;
    await fetch(`${API_BASE}/inventory/products`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_id: SHOP_ID, name, sell_price: price, stock_quantity: stock })
    });
    closeAddModal();
    loadInventory();
  }

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  loadInventory();
</script>
</body>
</html>
