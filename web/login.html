<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --green:#4E9A63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;padding:24px;
  }
  body.manager-bg{
    background:
      linear-gradient(180deg, rgba(27,27,29,.6) 0%, rgba(27,27,29,.8) 60%, rgba(27,27,29,.95) 100%),
      url('assets/manager-login-bg.jpg') center 30% / cover no-repeat fixed;
  }
  body.manager-bg .panel{
    background:rgba(27,27,29,.55);border:1px solid rgba(242,236,221,.12);border-radius:20px;
    padding:32px 28px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .pole-strip{
    position:fixed;top:0;left:0;right:0;height:8px;
    background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);
    background-size:200% 200%;animation:pole 10s linear infinite;
  }
  @keyframes pole{from{background-position:0 0;}to{background-position:220px 0;}}
  @media (prefers-reduced-motion: reduce){.pole-strip{animation:none;}}

  .back-link{position:fixed;top:24px;left:24px;color:var(--chalk-dim);text-decoration:none;font-size:13px;}
  .back-link:hover{color:var(--chalk);}

  .panel{width:100%;max-width:380px;text-align:center;}
  .group-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-bottom:6px;}
  .group-sub{color:var(--chalk-dim);font-size:13px;margin-bottom:28px;}

  /* Staff picker */
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:14px;margin-bottom:10px;}
  .staff-tile{
    background:var(--ink-raised);border:1.5px solid var(--ink-line);border-radius:14px;padding:16px 8px;
    cursor:pointer;transition:border-color .15s ease, transform .15s ease;
  }
  .staff-tile:hover{border-color:var(--amber);transform:translateY(-2px);}
  .staff-avatar{
    width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--barber-red),var(--amber));
    display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;
    color:var(--ink);margin:0 auto 10px;
  }
  .staff-tile-name{font-size:12.5px;font-weight:600;}
  .staff-tile-role{font-size:10.5px;color:var(--chalk-dim);text-transform:capitalize;}

  /* PIN pad */
  .selected-user{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;}
  .selected-avatar{
    width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--barber-red),var(--amber));
    display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--ink);
  }
  .selected-name{font-size:15px;font-weight:700;text-align:left;}
  .selected-role{font-size:11.5px;color:var(--chalk-dim);text-align:left;text-transform:capitalize;}
  .change-user{font-size:11.5px;color:var(--amber);cursor:pointer;margin-left:8px;}

  .pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-line);transition:all .15s ease;}
  .pin-dot.filled{background:var(--amber);border-color:var(--amber);}
  .pin-dots.error .pin-dot{border-color:var(--barber-red);}
  .pin-dots.shake{animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);} 80%{transform:translateX(6px);}
  }

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto;}
  .key{
    background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:14px;
    padding:18px 0;font-size:20px;font-weight:600;color:var(--chalk);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;transition:background .1s ease, transform .1s ease;
    user-select:none;
  }
  .key:active{transform:scale(0.94);background:rgba(232,163,61,.15);}
  .key.action{color:var(--chalk-dim);font-size:13px;font-family:'Inter',sans-serif;}

  .error-msg{color:var(--barber-red);font-size:12.5px;height:18px;margin-bottom:14px;}
  .loading-msg{color:var(--chalk-dim);font-size:12.5px;margin-top:20px;}

  @media (max-width:480px){
    body.manager-bg .panel{padding:24px 18px;}
    .group-title{font-size:22px;}
    .staff-grid{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px;}
    .staff-tile{padding:12px 6px;}
    .keypad{max-width:100%;gap:9px;}
    .key{padding:15px 0;font-size:18px;}
  }
</style>
</head>
<body>
<div class="pole-strip"></div>
<a class="back-link" href="index.html">‹ Back</a>

<div class="panel" id="panel">
  <div class="loading-msg">Loading staff…</div>
</div>

<script src="utils.js"></script>
<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  const params = new URLSearchParams(window.location.search);
  const group = params.get('group') || 'manager';
  if (group === 'manager') {
    document.body.classList.add('manager-bg');
  }
  let selectedUser = null;
  let pin = '';

  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }

  async function loadStaff() {
    const res = await fetch(`${API_BASE}/auth/staff?shop_id=${SHOP_ID}&group=${group}`);
    const staff = await res.json();
    renderPicker(staff);
  }

  function renderPicker(staff) {
    const panel = document.getElementById('panel');
    panel.innerHTML = `
      <div class="group-title">${group === 'admin' ? 'ADMIN LOGIN' : 'MANAGER LOGIN'}</div>
      <div class="group-sub">Tap your name to continue</div>
      <div class="staff-grid">
        ${staff.map(s => `
          <div class="staff-tile" onclick='selectUser(${JSON.stringify(s)})'>
            <div class="staff-avatar">${initials(s.full_name)}</div>
            <div class="staff-tile-name">${escapeHtml(s.full_name.split(' ')[0])}</div>
            <div class="staff-tile-role">${escapeHtml(s.role)}</div>
          </div>`).join('')}
      </div>
      ${staff.length === 0 ? '<div class="loading-msg">No accounts found for this group.</div>' : ''}
    `;
  }

  function selectUser(user) {
    selectedUser = user;
    pin = '';
    renderPinPad();
  }

  function renderPinPad() {
    const panel = document.getElementById('panel');
    panel.innerHTML = `
      <div class="selected-user">
        <div class="selected-avatar">${initials(selectedUser.full_name)}</div>
        <div>
          <div class="selected-name">${escapeHtml(selectedUser.full_name)}</div>
          <div class="selected-role">${escapeHtml(selectedUser.role)}</div>
        </div>
        <span class="change-user" onclick="loadStaff()">Change</span>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <div class="pin-dots" id="pinDots">
        ${[0,1,2,3].map(() => '<div class="pin-dot"></div>').join('')}
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<div class="key" onclick="pressKey('${n}')">${n}</div>`).join('')}
        <div class="key action" onclick="clearPin()">Clear</div>
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key action" onclick="backspace()">⌫</div>
      </div>
    `;
  }

  function updateDots() {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((d, i) => d.classList.toggle('filled', i < pin.length));
  }

  async function pressKey(digit) {
    if (pin.length >= 4) return;
    pin += digit;
    updateDots();
    if (pin.length === 4) {
      await submitPin();
    }
  }

  function backspace() {
    pin = pin.slice(0, -1);
    updateDots();
    document.getElementById('errorMsg').textContent = '';
  }

  function clearPin() {
    pin = '';
    updateDots();
    document.getElementById('errorMsg').textContent = '';
  }

  async function submitPin() {
    const errorMsg = document.getElementById('errorMsg');
    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: selectedUser.id, pin })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      data.loggedInAt = Date.now();
      localStorage.setItem('barberos_session', JSON.stringify(data));
      const destination = (data.role === 'owner' || data.role === 'manager') ? 'dashboard.html' : 'queue.html';
      window.location.href = destination;
    } catch (err) {
      errorMsg.textContent = err.message;
      const dotsEl = document.getElementById('pinDots');
      dotsEl.classList.add('error', 'shake');
      setTimeout(() => dotsEl.classList.remove('shake'), 400);
      pin = '';
      setTimeout(() => { updateDots(); dotsEl.classList.remove('error'); }, 500);
    }
  }

  loadStaff();
</script>
</body>
</html>
