<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Appointments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:900px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}
  .btn-add{background:var(--amber);color:var(--ink);border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .date-nav{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .date-nav button{background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;}
  .date-label{font-family:'IBM Plex Mono',monospace;font-size:14px;}

  .appt-list{display:flex;flex-direction:column;gap:10px;}
  .appt-card{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:16px;}
  .appt-time-block{
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--amber);
    background:rgba(232,163,61,.1);border-radius:8px;padding:8px 12px;text-align:center;min-width:64px;
  }
  .appt-info{flex:1;}
  .appt-name{font-weight:700;font-size:14px;}
  .appt-service{font-size:12.5px;color:var(--chalk-dim);margin-top:2px;}
  .appt-barber{font-size:12px;color:var(--chalk-dim);}
  .status-pill-sm{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600;}
  .status-pill-sm.scheduled{background:rgba(44,74,124,.18);color:var(--barber-blue);}
  .status-pill-sm.completed{background:rgba(78,154,99,.15);color:#4E9A63;}
  .status-pill-sm.cancelled,.status-pill-sm.no_show{background:rgba(200,53,46,.15);color:var(--barber-red);}
  .empty{text-align:center;padding:40px 10px;color:var(--chalk-dim);font-size:13px;border:1px dashed var(--ink-line);border-radius:var(--radius);}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:60;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:14px;padding:24px;width:380px;max-width:90vw;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:16px;}
  .modal label{font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;}
  .modal input, .modal select{width:100%;margin:6px 0 14px;padding:10px 12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:8px;}
  .modal-actions button{flex:1;padding:11px;border-radius:8px;cursor:pointer;font-size:13px;}
  .btn-cancel{background:var(--ink);border:1px solid var(--ink-line);color:var(--chalk-dim);}
  .btn-confirm{background:var(--amber);border:none;color:var(--ink);font-weight:700;}

  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
</style>
</head>
<body>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard">▦</a>
      <a class="rail-item" href="pos.html" title="POS / New Sale">✂</a>
      <a class="rail-item active" href="appointments.html" title="Appointments">📅</a>
      <a class="rail-item" href="queue.html" title="Queue">☰</a>
      <a class="rail-item" href="customers.html" title="Customers">👤</a>
      <a class="rail-item" href="staff.html" title="Staff">👥</a>
      <a class="rail-item" href="inventory.html" title="Inventory">📦</a>
      <a class="rail-item" href="reports.html" title="Reports">📈</a>
      <a class="rail-item" href="settings.html" title="Settings">⚙</a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()">⏻</div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">APPOINTMENTS</div>
        <div class="shop-sub">Kinyozi Management System · bookings by day</div>
      </div>
      <button class="btn-add" onclick="openAddModal()">+ New Appointment</button>
    </div>

    <div class="date-nav">
      <button onclick="shiftDate(-1)">‹</button>
      <span class="date-label" id="dateLabel"></span>
      <button onclick="shiftDate(1)">›</button>
    </div>

    <div class="appt-list" id="apptList">Loading…</div>
  </main>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">New Appointment</div>
    <label>Customer name</label>
    <input id="apName" placeholder="e.g. Alice Wanjiru">
    <label>Phone (optional)</label>
    <input id="apPhone" placeholder="07XX XXX XXX">
    <label>Barber</label>
    <select id="apBarber"></select>
    <label>Time</label>
    <input id="apTime" type="time" value="14:00">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitAppointment()">Book</button>
    </div>
  </div>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  let currentDate = new Date();

  function fmtDateISO(d) { return d.toISOString().slice(0, 10); }
  function fmtDateLabel(d) {
    const today = fmtDateISO(new Date());
    if (fmtDateISO(d) === today) return 'Today · ' + d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
  function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }

  function apptCardHTML(a) {
    const services = (a.services || []).filter(Boolean).join(' + ') || 'No services listed';
    return `
      <div class="appt-card">
        <div class="appt-time-block">${fmtTime(a.scheduled_at)}</div>
        <div class="appt-info">
          <div class="appt-name">${a.customer_name}</div>
          <div class="appt-service">${services}</div>
          <div class="appt-barber">${a.barber_name ? 'with ' + a.barber_name : 'No barber assigned'}</div>
        </div>
        <span class="status-pill-sm ${a.status}">${a.status.replace('_',' ')}</span>
      </div>`;
  }

  async function loadAppointments() {
    document.getElementById('dateLabel').textContent = fmtDateLabel(currentDate);
    const res = await fetch(`${API_BASE}/appointments?shop_id=${SHOP_ID}&date=${fmtDateISO(currentDate)}`);
    const appts = await res.json();
    document.getElementById('apptList').innerHTML = appts.length
      ? appts.map(apptCardHTML).join('')
      : `<div class="empty">No appointments booked for this day.</div>`;
  }

  function shiftDate(delta) {
    currentDate.setDate(currentDate.getDate() + delta);
    loadAppointments();
  }

  async function openAddModal() {
    const res = await fetch(`${API_BASE}/barbers?shop_id=${SHOP_ID}`);
    const barbers = await res.json();
    document.getElementById('apBarber').innerHTML = barbers.map(b => `<option value="${b.id}">${b.full_name}</option>`).join('');
    document.getElementById('apName').value = '';
    document.getElementById('apPhone').value = '';
    document.getElementById('addModal').classList.add('open');
  }
  function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

  async function submitAppointment() {
    const name = document.getElementById('apName').value.trim();
    const phone = document.getElementById('apPhone').value.trim();
    const barberId = document.getElementById('apBarber').value;
    const time = document.getElementById('apTime').value;
    if (!name || !time) return;

    const scheduledAt = `${fmtDateISO(currentDate)}T${time}:00`;
    await fetch(`${API_BASE}/appointments`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_id: SHOP_ID, customer_name: name, phone: phone || undefined, barber_id: barberId, scheduled_at: scheduledAt, service_ids: [] })
    });
    closeAddModal();
    loadAppointments();
  }

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  loadAppointments();
</script>
</body>
</html>
