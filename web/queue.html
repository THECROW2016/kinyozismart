<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428;
    --green:#4E9A63;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}

  .rail{
    position:relative;
    background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);
    background-size:200% 200%;
    animation:pole 14s linear infinite;
    display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;
  }
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-item svg{width:19px;height:19px;flex-shrink:0;}
  .rail-toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);
    padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;z-index:100;
  }
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1280px;}

  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}
  .btn-add{
    background:var(--amber);color:var(--ink);border:none;border-radius:10px;
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
  }

  .stat-strip{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-chip{
    background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:10px;
    padding:12px 18px;display:flex;align-items:baseline;gap:8px;
  }
  .stat-chip .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .stat-chip .l{font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;}

  .columns{display:grid;grid-template-columns:repeat(3, 1fr);gap:18px;align-items:start;}
  .col-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;padding:0 2px;
  }
  .col-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--chalk-dim);font-weight:700;}
  .col-count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--ink-raised);
    border:1px solid var(--ink-line);border-radius:999px;padding:2px 9px;color:var(--chalk-dim);
  }

  .ticket{
    background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:12px;position:relative;
  }
  .ticket.called{border-color:var(--amber);box-shadow:0 0 0 1px rgba(232,163,61,.25);}
  .ticket.in-service{border-color:var(--barber-blue);}
  .ticket-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .ticket-num{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
    width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .ticket.in-service .ticket-num{background:var(--barber-blue);color:var(--chalk);}
  .ticket-name{font-size:14.5px;font-weight:700;flex:1;}
  .ticket-wait{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--chalk-dim);}
  .ticket-service{font-size:12.5px;color:var(--chalk-dim);margin-bottom:10px;}
  .ticket-barber{
    display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:12px;
  }
  .barber-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .ticket-actions{display:flex;gap:8px;}
  .tkt-btn{
    flex:1;text-align:center;padding:8px;border-radius:8px;font-size:12px;font-weight:600;
    cursor:pointer;border:1px solid var(--ink-line);color:var(--chalk-dim);background:var(--ink);
  }
  .tkt-btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .tkt-btn.primary.blue{background:var(--barber-blue);color:var(--chalk);border-color:var(--barber-blue);}

  .empty{
    text-align:center;padding:30px 10px;color:var(--chalk-dim);font-size:12.5px;
    border:1px dashed var(--ink-line);border-radius:var(--radius);
  }

  @media (max-width:960px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
    .columns{grid-template-columns:1fr;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  @media (max-width:480px){
    .app{grid-template-columns:50px 1fr;}
    .rail-logo{width:32px;height:32px;font-size:12px;margin-bottom:12px;}
    .rail-item{width:36px;height:36px;}
    .rail-item svg{width:16px;height:16px;}
    main{padding:16px 12px 40px;}
    .shop-name{font-size:22px !important;}
    .shop-sub{font-size:11px;}
  }
</style>
</head>
<body>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
      <a class="rail-item" href="pos.html" title="POS / New Sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a>
      <a class="rail-item" href="appointments.html" title="Appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a class="rail-item active" href="queue.html" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="21" y2="6"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="12" x2="21" y2="12"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="18" x2="21" y2="18"/></svg></a>
      <a class="rail-item" href="customers.html" title="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
      <a class="rail-item" href="staff.html" title="Staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5c1.6.4 2.8 1.9 2.8 3.6 0 1.7-1.2 3.2-2.8 3.6"/><path d="M18.5 14.2c2.3.6 4 2.6 4 5"/></svg></a>
      <a class="rail-item" href="inventory.html" title="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg></a>
      <a class="rail-item" href="reports.html" title="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="21" y1="20" x2="21" y2="4"/></svg></a>
      <a class="rail-item" href="expenses.html" title="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg></a>
      <a class="rail-item" href="settings.html" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">WAITING BENCH</div>
        <div class="shop-sub">Kinyozi Management System · live queue</div>
      </div>
      <button class="btn-add">+ Add Walk-In</button>
    </div>

    <div class="stat-strip" id="statStrip">
      <div class="stat-chip"><span class="n" id="statWaitingCount">—</span><span class="l">Waiting</span></div>
      <div class="stat-chip"><span class="n" id="statInServiceCount">—</span><span class="l">In Service</span></div>
      <div class="stat-chip"><span class="n" id="statAvgWait">—</span><span class="l">Avg Wait Today</span></div>
    </div>

    <div class="columns">
      <div>
        <div class="col-head">
          <span class="col-title">Waiting</span>
          <span class="col-count" id="countWaiting">0</span>
        </div>
        <div id="colWaiting"></div>
      </div>

      <div>
        <div class="col-head">
          <span class="col-title">Called — Head to Chair</span>
          <span class="col-count" id="countCalled">0</span>
        </div>
        <div id="colCalled"></div>
      </div>

      <div>
        <div class="col-head">
          <span class="col-title">In Service</span>
          <span class="col-count" id="countInService">0</span>
        </div>
        <div id="colInService"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add walk-in modal -->
<div id="walkInModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:50;">
  <div style="background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:14px;padding:24px;width:340px;max-width:90vw;">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:16px;">Add Walk-In</div>
    <label style="font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;">Customer name</label>
    <input id="wiName" style="width:100%;margin:6px 0 14px;padding:10px 12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;" placeholder="e.g. James Mwangi">
    <label style="font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;">Phone (optional)</label>
    <input id="wiPhone" style="width:100%;margin:6px 0 14px;padding:10px 12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;" placeholder="07XX XXX XXX">
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="closeWalkInModal()" style="flex:1;padding:11px;border-radius:8px;background:var(--ink);border:1px solid var(--ink-line);color:var(--chalk-dim);cursor:pointer;">Cancel</button>
      <button onclick="submitWalkIn()" style="flex:1;padding:11px;border-radius:8px;background:var(--amber);border:none;color:var(--ink);font-weight:700;cursor:pointer;">Add to Queue</button>
    </div>
  </div>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';

  function timeSince(iso) {
    if (!iso) return '';
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    return mins <= 0 ? 'just now' : `${mins} min`;
  }

  function ticketHTML(e, columnType) {
    const services = (e.services || []).join(' + ') || 'No services listed';
    let actionsHTML = '';
    if (columnType === 'waiting') {
      actionsHTML = `<div class="tkt-btn primary" onclick="callCustomer('${e.id}')">Call to Chair</div>`;
    } else if (columnType === 'called') {
      actionsHTML = `<div class="tkt-btn primary" onclick="startService('${e.id}')">Start Service</div>`;
    } else if (columnType === 'in_service') {
      actionsHTML = `<div class="tkt-btn primary blue" onclick="window.location.href='pos.html?queue_entry=${e.id}'">Complete → POS</div>`;
    }
    const cls = columnType === 'called' ? 'called' : (columnType === 'in_service' ? 'in-service' : '');
    return `
      <div class="ticket ${cls}">
        <div class="ticket-top">
          <div class="ticket-num">${e.queue_number}</div>
          <div class="ticket-name">${escapeHtml(e.customer_name)}</div>
          <div class="ticket-wait">${timeSince(e.joined_at)}</div>
        </div>
        <div class="ticket-service">${escapeHtml(services)}</div>
        <div class="ticket-barber"><span class="barber-dot" style="background:${e.barber_name ? 'var(--barber-blue)' : 'var(--chalk-dim)'};"></span>${escapeHtml(e.barber_name || 'No preference')}</div>
        <div class="ticket-actions">${actionsHTML}</div>
      </div>`;
  }

  async function loadQueue() {
    try {
      const res = await fetch(`${API_BASE}/queue?shop_id=${SHOP_ID}`);
      const entries = await res.json();

      const waiting = entries.filter(e => e.status === 'waiting');
      const called = entries.filter(e => e.status === 'called');
      const inService = entries.filter(e => e.status === 'in_service');

      document.getElementById('colWaiting').innerHTML = waiting.length
        ? waiting.map(e => ticketHTML(e, 'waiting')).join('')
        : '<div class="empty">No one waiting right now.</div>';
      document.getElementById('colCalled').innerHTML = called.length
        ? called.map(e => ticketHTML(e, 'called')).join('')
        : '<div class="empty">Next customer will appear here once a barber goes free.</div>';
      document.getElementById('colInService').innerHTML = inService.length
        ? inService.map(e => ticketHTML(e, 'in_service')).join('')
        : '<div class="empty">No one currently in a chair.</div>';

      document.getElementById('countWaiting').textContent = waiting.length;
      document.getElementById('countCalled').textContent = called.length;
      document.getElementById('countInService').textContent = inService.length;
      document.getElementById('statWaitingCount').textContent = waiting.length + called.length;
      document.getElementById('statInServiceCount').textContent = inService.length;

      if (waiting.length) {
        const avgMins = Math.round(
          waiting.reduce((sum, e) => sum + (Date.now() - new Date(e.joined_at).getTime()) / 60000, 0) / waiting.length
        );
        document.getElementById('statAvgWait').textContent = avgMins + 'm';
      } else {
        document.getElementById('statAvgWait').textContent = '0m';
      }
    } catch (err) {
      console.error('Failed to load queue', err);
    }
  }

  async function callCustomer(id) {
    await fetch(`${API_BASE}/queue/${id}/call`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
    loadQueue();
  }
  async function startService(id) {
    await fetch(`${API_BASE}/queue/${id}/start`, { method: 'PATCH' });
    loadQueue();
  }

  function openWalkInModal() { document.getElementById('walkInModal').style.display = 'flex'; }
  function closeWalkInModal() {
    document.getElementById('walkInModal').style.display = 'none';
    document.getElementById('wiName').value = '';
    document.getElementById('wiPhone').value = '';
  }
  async function submitWalkIn() {
    const name = document.getElementById('wiName').value.trim();
    const phone = document.getElementById('wiPhone').value.trim();
    if (!name) return;
    await fetch(`${API_BASE}/queue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shop_id: SHOP_ID, customer_name: name, phone: phone || undefined, service_ids: [] })
    });
    closeWalkInModal();
    loadQueue();
  }

  document.querySelector('.btn-add').addEventListener('click', openWalkInModal);

  loadQueue();
  setInterval(loadQueue, 8000);

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet — Dashboard, POS, and Queue are the only working sections so far.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
