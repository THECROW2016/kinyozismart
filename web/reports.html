<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428; --green:#4E9A63;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1200px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}

  .range-tabs{display:flex;gap:8px;margin-bottom:22px;}
  .range-tab{background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk-dim);padding:8px 16px;border-radius:999px;font-size:12.5px;cursor:pointer;}
  .range-tab.active{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.1);}

  .summary-strip{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .summary-card{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);padding:16px 18px;}
  .summary-card .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);margin-bottom:8px;}
  .summary-card .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .summary-card.profit .n{color:var(--amber);}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  .card{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .card-title{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--chalk-dim);font-weight:600;margin-bottom:14px;}
  .chart-wrap{height:220px;}

  .rep-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--ink-line);font-size:13px;}
  .rep-row:last-child{border-bottom:none;}
  .rep-row .val{font-family:'IBM Plex Mono',monospace;}

  @media (max-width:900px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
    .grid2{grid-template-columns:1fr;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard">▦</a>
      <a class="rail-item" href="pos.html" title="POS / New Sale">✂</a>
      <a class="rail-item" href="appointments.html" title="Appointments">📅</a>
      <a class="rail-item" href="queue.html" title="Queue">☰</a>
      <a class="rail-item" href="customers.html" title="Customers">👤</a>
      <a class="rail-item" href="staff.html" title="Staff">👥</a>
      <a class="rail-item" href="inventory.html" title="Inventory">📦</a>
      <a class="rail-item active" href="reports.html" title="Reports">📈</a>
      <a class="rail-item" href="settings.html" title="Settings">⚙</a>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">REPORTS</div>
        <div class="shop-sub">Kinyozi Ndogo · performance overview</div>
      </div>
    </div>

    <div class="range-tabs" id="rangeTabs">
      <div class="range-tab" data-days="7">Last 7 days</div>
      <div class="range-tab active" data-days="30">Last 30 days</div>
      <div class="range-tab" data-days="90">Last 90 days</div>
    </div>

    <div class="summary-strip">
      <div class="summary-card"><div class="l">Revenue</div><div class="n" id="sumRevenue">—</div></div>
      <div class="summary-card"><div class="l">Expenses</div><div class="n" id="sumExpenses">—</div></div>
      <div class="summary-card"><div class="l">Commissions</div><div class="n" id="sumCommissions">—</div></div>
      <div class="summary-card profit"><div class="l">Profit</div><div class="n" id="sumProfit">—</div></div>
    </div>

    <div class="grid2">
      <div>
        <div class="card">
          <div class="card-title">Sales Over Time</div>
          <div class="chart-wrap"><canvas id="salesChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Popular Services</div>
          <div id="servicesList"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-title">Barber Commissions</div>
          <div id="commissionsList"></div>
        </div>
        <div class="card">
          <div class="card-title">Customer Growth</div>
          <div id="growthList"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  let chartInstance = null;
  let rangeDays = 30;

  function fmtKsh(n) { return 'KSh ' + Number(n).toLocaleString(); }
  function dateStr(d) { return d.toISOString().slice(0, 10); }

  function currentRange() {
    const to = new Date();
    const from = new Date();
    from.setDate(from.getDate() - (rangeDays - 1));
    return { from: dateStr(from), to: dateStr(to) };
  }

  async function loadReports() {
    const { from, to } = currentRange();
    const qs = `shop_id=${SHOP_ID}&from=${from}&to=${to}`;

    const [salesRes, servicesRes, commRes, profitRes, growthRes] = await Promise.all([
      fetch(`${API_BASE}/reports/sales?${qs}`),
      fetch(`${API_BASE}/reports/services?${qs}`),
      fetch(`${API_BASE}/reports/commissions?${qs}`),
      fetch(`${API_BASE}/reports/profit?${qs}`),
      fetch(`${API_BASE}/reports/customer-growth?${qs}`)
    ]);
    const sales = await salesRes.json();
    const services = await servicesRes.json();
    const commissions = await commRes.json();
    const profit = await profitRes.json();
    const growth = await growthRes.json();

    document.getElementById('sumRevenue').textContent = fmtKsh(profit.revenue);
    document.getElementById('sumExpenses').textContent = fmtKsh(profit.expenses);
    document.getElementById('sumCommissions').textContent = fmtKsh(profit.commissions);
    document.getElementById('sumProfit').textContent = fmtKsh(profit.profit);

    renderChart(sales.daily, from, to);

    document.getElementById('servicesList').innerHTML = services.length
      ? services.map(s => `<div class="rep-row"><span>${s.name} <span style="color:var(--chalk-dim);">×${s.times_sold}</span></span><span class="val">${fmtKsh(s.revenue)}</span></div>`).join('')
      : `<div class="rep-row"><span style="color:var(--chalk-dim);">No services sold in this range.</span></div>`;

    document.getElementById('commissionsList').innerHTML = commissions.length
      ? commissions.map(c => `<div class="rep-row"><span>${c.full_name} <span style="color:var(--chalk-dim);">(${c.sale_count} sales)</span></span><span class="val">${fmtKsh(c.commission_total)}</span></div>`).join('')
      : `<div class="rep-row"><span style="color:var(--chalk-dim);">No commissions in this range.</span></div>`;

    document.getElementById('growthList').innerHTML = `
      <div class="rep-row"><span>New customers</span><span class="val">${growth.new_customers}</span></div>
      <div class="rep-row"><span>Returning customers</span><span class="val">${growth.returning_customers}</span></div>
    `;
  }

  function renderChart(daily, from, to) {
    const days = [];
    let d = new Date(from);
    const end = new Date(to);
    while (d <= end) { days.push(dateStr(d)); d.setDate(d.getDate() + 1); }

    const byDay = Object.fromEntries((daily || []).map(r => [r.day.slice(0,10), Number(r.total)]));
    const values = days.map(d => byDay[d] || 0);
    const labels = days.map(d => new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }));

    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('salesChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values, borderColor: '#E8A33D', backgroundColor: 'rgba(232,163,61,.15)',
          fill: true, tension: 0.3, pointRadius: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          backgroundColor: '#1B1B1D', titleColor: '#F2ECDD', bodyColor: '#F2ECDD',
          borderColor: '#3A3936', borderWidth: 1, callbacks: { label: (item) => fmtKsh(item.raw) }
        }},
        scales: {
          x: { grid: { display: false }, ticks: { color: '#B8B3A6', font: { size: 10 }, maxTicksLimit: 8 } },
          y: { grid: { color: '#3A3936' }, ticks: { color: '#B8B3A6', font: { size: 10 } } }
        }
      }
    });
  }

  document.querySelectorAll('.range-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.range-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      rangeDays = Number(tab.dataset.days);
      loadReports();
    });
  });

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  loadReports();
</script>
</body>
</html>
