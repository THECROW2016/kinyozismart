<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Styles</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428; --green:#4E9A63;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1240px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:6px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;margin-bottom:22px;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px;}
  .search-box{
    flex:1;min-width:200px;background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:10px;
    padding:11px 14px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .search-box::placeholder{color:var(--chalk-dim);}
  .filter-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk-dim);
    padding:9px 15px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .chip.active{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.1);}

  .style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .style-card{
    background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);
    padding:18px;cursor:pointer;transition:border-color .15s ease, transform .15s ease;
  }
  .style-card:hover{border-color:var(--amber);transform:translateY(-3px);}
  .style-icon{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;margin-bottom:14px;background:linear-gradient(135deg,var(--barber-red),var(--amber));
  }
  .style-name{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .style-desc{font-size:12px;color:var(--chalk-dim);line-height:1.5;margin-bottom:12px;min-height:36px;}
  .style-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;padding:3px 9px;border-radius:999px;background:rgba(184,179,166,.1);color:var(--chalk-dim);}
  .tag.trending{background:rgba(232,163,61,.15);color:var(--amber);}
  .tag.low-maint{background:rgba(78,154,99,.15);color:var(--green);}
  .empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--chalk-dim);font-size:13px;}

  /* Detail modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modal-overlay.open{display:flex;}
  .detail-modal{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:16px;padding:28px;width:420px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .detail-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--barber-red),var(--amber));margin-bottom:16px;}
  .detail-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;margin-bottom:4px;}
  .detail-cat{font-size:11.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;}
  .detail-section{margin-bottom:16px;}
  .detail-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);font-weight:600;margin-bottom:6px;}
  .detail-text{font-size:13.5px;line-height:1.6;color:var(--chalk);}
  .detail-close{position:absolute;}
  .modal-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .close-x{color:var(--chalk-dim);cursor:pointer;font-size:20px;}
  .book-btn{
    width:100%;background:var(--amber);color:var(--ink);border:none;border-radius:10px;
    padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:8px;
  }

  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
</style>
</head>
<body>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard">▦</a>
      <a class="rail-item" href="pos.html" title="POS / New Sale">✂</a>
      <a class="rail-item" href="appointments.html" title="Appointments">📅</a>
      <a class="rail-item" href="queue.html" title="Queue">☰</a>
      <a class="rail-item" href="customers.html" title="Customers">👤</a>
      <a class="rail-item" href="staff.html" title="Staff">👥</a>
      <a class="rail-item" href="inventory.html" title="Inventory">📦</a>
      <a class="rail-item active" href="styles.html" title="Styles">💇</a>
      <a class="rail-item" href="reports.html" title="Reports">📈</a>
      <a class="rail-item" href="settings.html" title="Settings">⚙</a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()">⏻</div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">STYLE GALLERY</div>
      </div>
    </div>
    <div class="shop-sub">Popular cuts requested across Kenyan barbershops — the standard menu every barber should know</div>

    <div class="controls">
      <input class="search-box" id="searchBox" placeholder="Search styles… e.g. taper, waves, cornrows">
    </div>
    <div class="filter-chips" id="filterChips" style="margin-bottom:22px;"></div>

    <div class="style-grid" id="styleGrid"></div>
  </main>
</div>

<div class="modal-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-modal" onclick="event.stopPropagation()">
    <div class="modal-top">
      <div class="detail-icon" id="dIcon">✂️</div>
      <span class="close-x" onclick="closeDetail()">✕</span>
    </div>
    <div class="detail-name" id="dName"></div>
    <div class="detail-cat" id="dCat"></div>
    <div class="detail-section">
      <div class="detail-label">What it is</div>
      <div class="detail-text" id="dDesc"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Maintenance</div>
      <div class="detail-text" id="dMaint"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Good to know</div>
      <div class="detail-text" id="dTip"></div>
    </div>
    <button class="book-btn" onclick="bookStyle()">Book This Style →</button>
  </div>
</div>

<script>
  const STYLES = [
    { name: 'Low Taper Fade', cat: 'Fades', icon: '✂️', desc: 'Hair gradually shortens from the top down to the skin near the hairline, kept subtle and close to the ears.', maint: 'Every 2–3 weeks to keep the fade line crisp.', tip: 'The most requested cut in Kenyan barbershops — clean, professional, works with any hair length on top.', tags: ['Trending'] },
    { name: 'Mid Fade', cat: 'Fades', icon: '✂️', desc: 'The fade starts higher, around temple level, for more contrast between the top and sides.', maint: 'Every 2–3 weeks.', tip: 'A safe middle ground between subtle and sharp — pairs well with a beard line-up.', tags: [] },
    { name: 'High Top Fade', cat: 'Fades', icon: '✂️', desc: 'Fade starts high on the sides, leaving significant length and volume on top for shape-ups or a box/flat top.', maint: 'Every 2 weeks — grows out noticeably fast.', tip: 'A classic Black American style that\'s made a strong comeback; needs a skilled hand for straight edges.', tags: ['Trending'] },
    { name: 'Skin (Bald) Fade', cat: 'Fades', icon: '✂️', desc: 'Fades all the way down to bare skin at the bottom, for maximum contrast against the top.', maint: 'Every 1–2 weeks to keep the skin line sharp.', tip: 'Requires the most upkeep of any fade — ask your barber how often before committing.', tags: ['Trending'] },
    { name: 'Burst Fade', cat: 'Fades', icon: '✂️', desc: 'Fades in a semi-circle around the ear only, leaving length at the back and top — often paired with a mohawk or curls.', maint: 'Every 2–3 weeks.', tip: 'A more stylized option that photographs well; popular with curly and coily hair textures.', tags: [] },
    { name: 'Drop Fade', cat: 'Fades', icon: '✂️', desc: 'The fade line curves ("drops") behind the ear instead of staying straight, following the head\'s natural shape.', maint: 'Every 2–3 weeks.', tip: 'Flattering for most head shapes; ask for it "with a drop" specifically or you\'ll get a standard fade.', tags: [] },

    { name: 'Afro', cat: 'Natural & Afro', icon: '🌀', desc: 'Natural coily hair grown out and shaped into a rounded silhouette, unstraightened.', maint: 'Regular trims to maintain shape; daily moisturizing.', tip: 'A statement style with deep cultural roots — many barbershops offer an "afro shape-up" rather than a full cut.', tags: ['Low maintenance'] },
    { name: 'Taper Afro', cat: 'Natural & Afro', icon: '🌀', desc: 'An afro on top with a tapered, faded sides and back for a cleaner overall silhouette.', maint: 'Sides every 2–3 weeks; top left to grow.', tip: 'A great middle ground for clients who want natural texture but a neater finish.', tags: [] },
    { name: 'Twist Out', cat: 'Natural & Afro', icon: '🌀', desc: 'Hair is two-strand twisted, left to set, then unraveled for a defined, voluminous curl pattern.', maint: 'Re-twisted every 1–2 weeks to maintain definition.', tip: 'More of a styling service than a cut — check if your barbershop offers twist services separately from haircuts.', tags: ['Low maintenance'] },
    { name: 'Fro-Hawk', cat: 'Natural & Afro', icon: '🌀', desc: 'A mohawk silhouette using natural afro-textured hair down the center, faded or shaved on the sides.', maint: 'Sides every 2 weeks.', tip: 'Bold and distinctive — best discussed with reference photos before your barber starts cutting.', tags: [] },

    { name: 'Cornrows (Straight Back)', cat: 'Braids & Twists', icon: '🧵', desc: 'Hair braided close to the scalp in straight rows from front to back.', maint: 'Lasts 2–4 weeks with proper care before re-braiding.', tip: 'One of the most requested protective styles — book extra time, a full head typically takes 1–2 hours.', tags: ['Low maintenance'] },
    { name: 'Box Braids', cat: 'Braids & Twists', icon: '🧵', desc: 'Individual square-parted braids, often done with extensions for length and thickness.', maint: 'Lasts 4–8 weeks.', tip: 'A longer appointment — many shops recommend booking this as its own slot rather than a walk-in.', tags: [] },
    { name: 'Two-Strand Twists', cat: 'Braids & Twists', icon: '🧵', desc: 'Two sections of hair twisted around each other from root to tip, without extensions.', maint: 'Lasts 2–4 weeks.', tip: 'Gentler on the scalp than braiding — a popular option for finer or shorter natural hair.', tags: ['Low maintenance'] },
    { name: 'Feed-in Braids', cat: 'Braids & Twists', icon: '🧵', desc: 'Braids that start thin near the hairline and gradually incorporate more hair (or extensions) as they go, for a natural taper.', maint: 'Lasts 3–6 weeks.', tip: 'Looks more natural at the root than standard box braids — a common upgrade request.', tags: ['Trending'] },

    { name: '360 Waves', cat: 'Waves', icon: '🌊', desc: 'Short hair brushed consistently in a circular pattern to train a rippling wave texture across the whole head.', maint: 'Daily brushing (durag/wave cap at night) plus a trim every 2–3 weeks.', tip: 'The cut alone won\'t give waves — ask your barber for wave-friendly length and brushing tips.', tags: ['Trending'] },
    { name: 'Brush Waves', cat: 'Waves', icon: '🌊', desc: 'A looser, less uniform wave pattern than 360s, usually with a bit more length on top.', maint: 'Regular brushing; trims every 3 weeks.', tip: 'A lower-commitment entry point if you\'re not ready for full 360 wave maintenance.', tags: ['Low maintenance'] },

    { name: 'Beard Line-Up', cat: 'Beard Styles', icon: '🧔', desc: 'Sharp, straight edges cut into the beard along the cheek, neck, and jaw lines.', maint: 'Every 1–2 weeks to keep lines crisp.', tip: 'Usually add-on pricing at most shops — worth asking if it\'s bundled with a haircut.', tags: [] },
    { name: 'Full Beard Sculpt', cat: 'Beard Styles', icon: '🧔', desc: 'The whole beard is shaped, trimmed to an even length, and defined with hot towel and razor work.', maint: 'Every 2–3 weeks.', tip: 'A hot towel shave add-on is common in Kenyan barbershops and elevates the finish noticeably.', tags: [] },
    { name: 'Goatee', cat: 'Beard Styles', icon: '🧔', desc: 'Chin-focused facial hair, cheeks and neck shaved clean, sometimes connected to a thin mustache.', maint: 'Every 1–2 weeks.', tip: 'Lower-maintenance than a full beard while still framing the jawline.', tags: ['Low maintenance'] },

    { name: 'Caesar Cut', cat: 'Classic & Kids', icon: '👦', desc: 'Short, horizontally-fringed hair combed forward, uniform length all around.', maint: 'Every 3–4 weeks.', tip: 'A timeless, low-fuss option that works well for formal or corporate settings.', tags: ['Low maintenance'] },
    { name: 'Buzz Cut', cat: 'Classic & Kids', icon: '👦', desc: 'Uniform, very short length all over using clippers with no fading or blending.', maint: 'Every 3–4 weeks.', tip: 'The fastest, most affordable cut on most price lists — a good default walk-in choice.', tags: ['Low maintenance'] },
    { name: 'Kids Line Up', cat: 'Classic & Kids', icon: '👦', desc: 'A simple shape-up with a clean hairline and light fade, scaled down for younger clients.', maint: 'Every 2–3 weeks.', tip: 'Many shops price this separately and keep sessions shorter for younger kids.', tags: [] }
  ];

  const categories = ['All', ...Array.from(new Set(STYLES.map(s => s.cat)))];
  let activeCat = 'All';
  let searchTerm = '';
  let currentDetail = null;

  function renderChips() {
    document.getElementById('filterChips').innerHTML = categories.map(c =>
      `<div class="chip ${c === activeCat ? 'active' : ''}" onclick="setCategory('${c}')">${c}</div>`
    ).join('');
  }

  function setCategory(cat) {
    activeCat = cat;
    renderChips();
    renderGrid();
  }

  function tagClass(tag) {
    if (tag === 'Trending') return 'tag trending';
    if (tag === 'Low maintenance') return 'tag low-maint';
    return 'tag';
  }

  function renderGrid() {
    const term = searchTerm.toLowerCase();
    const filtered = STYLES.filter(s =>
      (activeCat === 'All' || s.cat === activeCat) &&
      (s.name.toLowerCase().includes(term) || s.cat.toLowerCase().includes(term) || s.desc.toLowerCase().includes(term))
    );

    const grid = document.getElementById('styleGrid');
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty">No styles match "${searchTerm}".</div>`;
      return;
    }

    grid.innerHTML = filtered.map((s, i) => `
      <div class="style-card" onclick="openDetail(${STYLES.indexOf(s)})">
        <div class="style-icon">${s.icon}</div>
        <div class="style-name">${s.name}</div>
        <div class="style-desc">${s.desc}</div>
        <div class="style-tags">
          <span class="tag">${s.cat}</span>
          ${s.tags.map(t => `<span class="${tagClass(t)}">${t}</span>`).join('')}
        </div>
      </div>`).join('');
  }

  function openDetail(idx) {
    const s = STYLES[idx];
    currentDetail = s;
    document.getElementById('dIcon').textContent = s.icon;
    document.getElementById('dName').textContent = s.name;
    document.getElementById('dCat').textContent = s.cat;
    document.getElementById('dDesc').textContent = s.desc;
    document.getElementById('dMaint').textContent = s.maint;
    document.getElementById('dTip').textContent = s.tip;
    document.getElementById('detailOverlay').classList.add('open');
  }

  function closeDetail(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('detailOverlay').classList.remove('open');
  }

  function bookStyle() {
    if (!currentDetail) return;
    window.location.href = `appointments.html?style=${encodeURIComponent(currentDetail.name)}`;
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderGrid();
  });

  renderChips();
  renderGrid();
</script>
</body>
</html>
