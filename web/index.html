<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Kinyozi Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --green:#4E9A63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--chalk);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;
    background:
      linear-gradient(180deg, rgba(27,27,29,.55) 0%, rgba(27,27,29,.75) 55%, rgba(27,27,29,.94) 100%),
      url('assets/salon-hero.jpg') center 20% / cover no-repeat fixed;
  }
  .pole-strip{
    position:fixed;top:0;left:0;right:0;height:8px;z-index:2;
    background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);
    background-size:200% 200%;animation:pole 10s linear infinite;
  }
  @keyframes pole{from{background-position:0 0;}to{background-position:220px 0;}}
  @media (prefers-reduced-motion: reduce){.pole-strip{animation:none;}}

  .hero{
    text-align:center;padding:44px 32px;max-width:640px;position:relative;z-index:1;
    background:rgba(27,27,29,.5);border:1px solid rgba(242,236,221,.12);border-radius:24px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo-mark{
    width:74px;height:74px;border-radius:50%;background:var(--ink-raised);border:2.5px solid var(--chalk);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;
  }
  .brand{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:2px;line-height:1;}
  .tagline{color:var(--chalk-dim);font-size:14.5px;margin-top:10px;}

  .status-row{
    display:flex;align-items:center;justify-content:center;gap:18px;margin-top:26px;flex-wrap:wrap;
  }
  .status-pill{
    display:inline-flex;align-items:center;gap:7px;background:rgba(232,163,61,.15);color:var(--amber);
    border:1px solid rgba(232,163,61,.4);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.2);}
  .live-stat{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--chalk-dim);}
  .live-stat b{color:var(--chalk);}

  .cta-row{display:flex;gap:16px;margin-top:40px;justify-content:center;flex-wrap:wrap;}
  .cta-card{
    width:220px;background:rgba(36,36,38,.85);border:1px solid var(--ink-line);border-radius:16px;
    padding:26px 20px;cursor:pointer;text-decoration:none;color:var(--chalk);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .cta-card:hover{transform:translateY(-4px);border-color:var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .cta-icon{font-size:30px;margin-bottom:12px;}
  .cta-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;}
  .cta-sub{font-size:12px;color:var(--chalk-dim);margin-top:6px;line-height:1.4;}

  .clock{
    margin-top:34px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--chalk-dim);
  }

  footer{position:fixed;bottom:18px;font-size:11.5px;color:var(--chalk-dim);text-shadow:0 1px 4px rgba(0,0,0,.6);z-index:1;}
</style>
</head>
<body>
<div class="pole-strip"></div>

<div class="hero">
  <div class="logo-mark">BO</div>
  <div class="brand">KINYOZI MANAGEMENT SYSTEM</div>
  <div class="tagline">Fresh Fades. Trusted Hands. Every Time.</div>

  <div class="status-row">
    <span class="status-pill"><span class="status-dot"></span><span id="openStatus">Checking hours…</span></span>
    <span class="live-stat" id="queueStat">— waiting now</span>
  </div>

  <div class="cta-row">
    <a class="cta-card" href="login.html?group=admin">
      <div class="cta-icon">🗝️</div>
      <div class="cta-title">ADMIN LOGIN</div>
      <div class="cta-sub">Owners &amp; managers — dashboard, reports, settings</div>
    </a>
    <a class="cta-card" href="login.html?group=user">
      <div class="cta-icon">✂️</div>
      <div class="cta-title">STAFF LOGIN</div>
      <div class="cta-sub">Barbers &amp; receptionists — queue, POS, appointments</div>
    </a>
  </div>

  <div class="clock" id="liveClock"></div>
</div>

<footer>BarberOS · Nairobi, Kenya</footer>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';

  function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').textContent = now.toLocaleString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);

  async function loadShopStatus() {
    try {
      const res = await fetch(`${API_BASE}/settings/shop?shop_id=${SHOP_ID}`);
      const shop = await res.json();
      const now = new Date();
      const [openH, openM] = (shop.opening_time || '08:00').split(':').map(Number);
      const [closeH, closeM] = (shop.closing_time || '20:00').split(':').map(Number);
      const nowMins = now.getHours() * 60 + now.getMinutes();
      const openMins = openH * 60 + openM;
      const closeMins = closeH * 60 + closeM;
      const isOpen = nowMins >= openMins && nowMins < closeMins;
      document.getElementById('openStatus').textContent = isOpen
        ? `OPEN · closes ${shop.closing_time.slice(0,5)}`
        : `CLOSED · opens ${shop.opening_time.slice(0,5)}`;
    } catch (err) {
      document.getElementById('openStatus').textContent = 'Hours unavailable';
    }
  }

  async function loadQueueStat() {
    try {
      const res = await fetch(`${API_BASE}/queue?shop_id=${SHOP_ID}`);
      const entries = await res.json();
      const waiting = entries.filter(e => e.status !== 'in_service').length;
      document.getElementById('queueStat').innerHTML = `<b>${waiting}</b> waiting now`;
    } catch (err) {
      document.getElementById('queueStat').textContent = '';
    }
  }

  loadShopStatus();
  loadQueueStat();
  setInterval(loadQueueStat, 20000);
</script>
</body>
</html>
