<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428; --green:#4E9A63;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-item svg{width:19px;height:19px;flex-shrink:0;}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1200px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}
  .btn-add{background:var(--amber);color:var(--ink);border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:18px;}

  .login-history-card{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);padding:20px;margin-top:26px;}
  .lh-title{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--chalk-dim);font-weight:600;margin-bottom:14px;}
  .lh-sub{text-transform:none;letter-spacing:normal;font-weight:400;color:var(--chalk-dim);}
  .lh-table{width:100%;border-collapse:collapse;}
  .lh-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--chalk-dim);font-weight:600;padding:0 10px 8px;}
  .lh-table td{padding:10px;font-size:12.5px;border-top:1px dashed var(--ink-line);}
  .lh-table tr:first-child td{border-top:none;}
  .lh-role{font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px;background:rgba(44,74,124,.18);color:var(--barber-blue);}
  .lh-time{font-family:'IBM Plex Mono',monospace;color:var(--chalk-dim);}
  .lh-active{color:var(--green);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .lh-empty{text-align:center;color:var(--chalk-dim);padding:20px;}

  @media (max-width:860px){
    .lh-table thead{display:none;}
    .lh-table, .lh-table tbody, .lh-table tr, .lh-table td{display:block;width:100%;}
    .lh-table tr{border-top:1px dashed var(--ink-line);padding:8px 0;}
    .lh-table tr:first-child{border-top:none;}
    .lh-table td{padding:2px 0;border-top:none;}
  }
  .staff-card{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:var(--radius);padding:20px;}
  .staff-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .staff-delete{cursor:pointer;color:var(--chalk-dim);font-size:14px;padding:6px;border-radius:6px;flex-shrink:0;align-self:flex-start;}
  .staff-delete:hover{color:var(--barber-red);background:rgba(200,53,46,.12);}
  .staff-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg, var(--barber-red), var(--amber));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--ink);flex-shrink:0;overflow:hidden;}
  .staff-avatar img{width:100%;height:100%;object-fit:cover;}
  .staff-name{font-weight:700;font-size:15px;}
  .staff-spec{font-size:11.5px;color:var(--chalk-dim);margin-top:2px;}
  .role-badge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:999px;background:rgba(44,74,124,.18);color:var(--barber-blue);display:inline-block;margin-top:4px;}

  .staff-stats{display:flex;gap:16px;margin-bottom:16px;padding:14px 0;border-top:1px dashed var(--ink-line);border-bottom:1px dashed var(--ink-line);}
  .staff-stat .n{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;}
  .staff-stat .l{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;}

  .staff-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px;}
  .staff-row .label{color:var(--chalk-dim);}
  .staff-row .val{font-family:'IBM Plex Mono',monospace;}

  .attend-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:999px;margin-bottom:14px;
  }
  .attend-badge.in{background:rgba(78,154,99,.15);color:var(--green);border:1px solid rgba(78,154,99,.4);}
  .attend-badge.out{background:rgba(184,179,166,.1);color:var(--chalk-dim);border:1px solid var(--ink-line);}
  .attend-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .clock-btn{
    width:100%;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;
  }
  .clock-btn.in{background:var(--amber);color:var(--ink);}
  .clock-btn.out{background:transparent;border:1px solid var(--ink-line);color:var(--chalk-dim);}

  /* Registration modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modal-overlay.open{display:flex;}
  .reg-modal{background:var(--ink-raised);border:1px solid var(--ink-line);border-radius:16px;padding:26px;width:400px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .reg-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;margin-bottom:18px;}
  .reg-field{margin-bottom:14px;}
  .reg-field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--chalk-dim);display:block;margin-bottom:6px;}
  .reg-field input, .reg-field select{width:100%;padding:10px 12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:13.5px;}
  .photo-upload{display:flex;align-items:center;gap:14px;}
  .photo-preview{width:56px;height:56px;border-radius:50%;background:var(--ink);border:1.5px dashed var(--ink-line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--chalk-dim);font-size:11px;text-align:center;}
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-upload input[type=file]{font-size:11.5px;color:var(--chalk-dim);}
  .reg-error{color:var(--barber-red);font-size:12px;margin-bottom:10px;min-height:16px;}
  .reg-actions{display:flex;gap:8px;margin-top:6px;}
  .reg-actions button{flex:1;padding:11px;border-radius:8px;cursor:pointer;font-size:13px;border:none;}
  .btn-cancel{background:var(--ink);border:1px solid var(--ink-line);color:var(--chalk-dim);}
  .btn-confirm{background:var(--amber);color:var(--ink);font-weight:700;}

  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  @media (max-width:480px){
    .app{grid-template-columns:50px 1fr;}
    .rail-logo{width:32px;height:32px;font-size:12px;margin-bottom:12px;}
    .rail-item{width:36px;height:36px;}
    .rail-item svg{width:16px;height:16px;}
    main{padding:16px 12px 40px;}
    .shop-name{font-size:22px !important;}
    .shop-sub{font-size:11px;}
  }
</style>
</head>
<body>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
      <a class="rail-item" href="pos.html" title="POS / New Sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a>
      <a class="rail-item" href="appointments.html" title="Appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a class="rail-item" href="queue.html" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="21" y2="6"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="12" x2="21" y2="12"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="18" x2="21" y2="18"/></svg></a>
      <a class="rail-item" href="customers.html" title="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
      <a class="rail-item active" href="staff.html" title="Staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5c1.6.4 2.8 1.9 2.8 3.6 0 1.7-1.2 3.2-2.8 3.6"/><path d="M18.5 14.2c2.3.6 4 2.6 4 5"/></svg></a>
      <a class="rail-item" href="inventory.html" title="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg></a>
      <a class="rail-item" href="reports.html" title="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="21" y1="20" x2="21" y2="4"/></svg></a>
      <a class="rail-item" href="expenses.html" title="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg></a>
      <a class="rail-item" href="settings.html" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">STAFF</div>
        <div class="shop-sub">Kinyozi Management System · today's performance &amp; attendance</div>
      </div>
      <button class="btn-add" id="addStaffBtn" style="display:none;" onclick="openRegModal()">+ Register Staff</button>
    </div>

    <div class="staff-grid" id="staffGrid">Loading…</div>

    <div class="login-history-card" id="loginHistoryCard">
      <div class="lh-title">Login History <span class="lh-sub">— Admin sign-in activity</span></div>
      <table class="lh-table">
        <thead><tr><th>Account</th><th>Role</th><th>Logged In</th><th>Logged Out</th></tr></thead>
        <tbody id="loginHistoryBody"><tr><td colspan="4" class="lh-empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="regModal">
  <div class="reg-modal">
    <div class="reg-title">Register Staff</div>
    <div class="reg-error" id="regError"></div>

    <div class="reg-field">
      <label>Photo</label>
      <div class="photo-upload">
        <div class="photo-preview" id="photoPreview">No photo</div>
        <input type="file" accept="image/*" id="regPhoto" onchange="handlePhotoSelect(event)">
      </div>
    </div>
    <div class="reg-field"><label>Full name</label><input id="regName" placeholder="e.g. James Mwangi"></div>
    <div class="reg-field"><label>Phone</label><input id="regPhone" placeholder="07XX XXX XXX"></div>
    <div class="reg-field">
      <label>Role</label>
      <select id="regRole" onchange="toggleBarberFields()">
        <option value="barber">Barber</option>
        <option value="beautician">Beautician</option>
        <option value="receptionist">Receptionist</option>
        <option value="manager">Manager</option>
        <option value="secretary">Secretary</option>
      </select>
    </div>
    <div id="barberFields">
      <div class="reg-field"><label>Specialties (comma-separated)</label><input id="regSpecialties" placeholder="Fades, Beard trim"></div>
      <div class="reg-field"><label>Commission rate (%)</label><input id="regCommission" type="number" value="40"></div>
    </div>
    <div class="reg-field" id="pinField"><label>4-digit login PIN</label><input id="regPin" maxlength="4" inputmode="numeric" placeholder="e.g. 6789"></div>
    <div class="reg-field" id="pinNote" style="display:none;color:var(--chalk-dim);font-size:11.5px;margin-top:-8px;">This role doesn't log into the app individually — no PIN needed.</div>

    <div class="reg-actions">
      <button class="btn-cancel" onclick="closeRegModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitRegistration()">Register</button>
    </div>
  </div>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  let selectedPhotoData = null;

  function fmtKsh(n) { return 'KSh ' + Number(n).toLocaleString(); }
  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }
  function avatarHTML(person) {
    return person.photo_url
      ? `<img src="${escapeHtml(person.photo_url)}" alt="${escapeHtml(person.full_name)}">`
      : initials(person.full_name);
  }

  function staffCardHTML(b) {
    const isProvider = b.role === 'barber' || b.role === 'beautician';
    const safeName = b.full_name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    const deleteBtn = window.barberOSCanDelete
      ? `<span class="staff-delete" title="Remove ${escapeHtml(b.full_name)}" onclick="deleteStaff('${b.id}','${safeName}')">🗑</span>`
      : '';

    if (!isProvider) {
      // Simplified card for receptionists/managers/secretaries — no commission/attendance data
      return `
        <div class="staff-card">
          <div class="staff-top">
            <div class="staff-avatar">${avatarHTML(b)}</div>
            <div style="flex:1;">
              <div class="staff-name">${escapeHtml(b.full_name)}</div>
              <div class="staff-spec">${escapeHtml(b.phone || '')}</div>
              <span class="role-badge">${escapeHtml(b.role)}</span>
            </div>
            ${deleteBtn}
          </div>
        </div>`;
    }

    const clockedIn = b.clock_in && !b.clock_out;
    const badge = clockedIn
      ? `<span class="attend-badge in"><span class="attend-dot"></span>On shift since ${new Date(b.clock_in).toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})}</span>`
      : `<span class="attend-badge out"><span class="attend-dot"></span>Not clocked in</span>`;
    const btn = clockedIn
      ? `<button class="clock-btn out" onclick="clockOut('${b.id}')">Clock Out</button>`
      : `<button class="clock-btn in" onclick="clockIn('${b.id}')">Clock In</button>`;

    return `
      <div class="staff-card">
        <div class="staff-top">
          <div class="staff-avatar">${avatarHTML(b)}</div>
          <div style="flex:1;">
            <div class="staff-name">${escapeHtml(b.full_name)}</div>
            <div class="staff-spec">${escapeHtml((b.specialties || []).join(', ') || 'General')}</div>
          </div>
          ${deleteBtn}
        </div>
        ${badge}
        <div class="staff-stats">
          <div class="staff-stat"><div class="n">${b.services_today}</div><div class="l">Services</div></div>
          <div class="staff-stat"><div class="n">${fmtKsh(b.revenue_today)}</div><div class="l">Revenue</div></div>
          <div class="staff-stat"><div class="n">${b.rating_avg}★</div><div class="l">Rating</div></div>
        </div>
        <div class="staff-row"><span class="label">Commission rate</span><span class="val">${b.commission_rate}%</span></div>
        <div class="staff-row"><span class="label">Commission owed today</span><span class="val">${fmtKsh(b.commission_today)}</span></div>
        ${btn}
      </div>`;
  }

  async function deleteStaff(id, name) {
    if (!confirm(`Remove ${name} from active staff? Their sales/commission history is kept, they just won't appear on the roster anymore.`)) return;
    await fetch(`${API_BASE}/staff/${id}`, { method: 'DELETE' });
    loadStaff();
  }

  async function loadStaff() {
    const res = await fetch(`${API_BASE}/staff?shop_id=${SHOP_ID}`);
    const staff = await res.json();
    document.getElementById('staffGrid').innerHTML = staff.map(staffCardHTML).join('');
  }

  async function clockIn(id) {
    await fetch(`${API_BASE}/staff/${id}/clock-in`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ shop_id: SHOP_ID })
    });
    loadStaff();
  }
  async function clockOut(id) {
    await fetch(`${API_BASE}/staff/${id}/clock-out`, { method: 'POST' });
    loadStaff();
  }

  // ---- Registration (owner only) ----
  function openRegModal() {
    document.getElementById('regName').value = '';
    document.getElementById('regPhone').value = '';
    document.getElementById('regRole').value = 'barber';
    document.getElementById('regSpecialties').value = '';
    document.getElementById('regCommission').value = '40';
    document.getElementById('regPin').value = '';
    document.getElementById('regError').textContent = '';
    document.getElementById('photoPreview').innerHTML = 'No photo';
    selectedPhotoData = null;
    toggleBarberFields();
    document.getElementById('regModal').classList.add('open');
  }
  function closeRegModal() { document.getElementById('regModal').classList.remove('open'); }

  function toggleBarberFields() {
    const role = document.getElementById('regRole').value;
    const isProvider = role === 'barber' || role === 'beautician';
    const needsPin = role === 'manager' || role === 'secretary';
    document.getElementById('barberFields').style.display = isProvider ? 'block' : 'none';
    document.getElementById('pinField').style.display = needsPin ? 'block' : 'none';
    document.getElementById('pinNote').style.display = needsPin ? 'none' : 'block';
  }

  function handlePhotoSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      document.getElementById('regError').textContent = 'Photo must be under 4MB.';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      selectedPhotoData = reader.result;
      document.getElementById('photoPreview').innerHTML = `<img src="${selectedPhotoData}">`;
    };
    reader.readAsDataURL(file);
  }

  async function submitRegistration() {
    const full_name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const role = document.getElementById('regRole').value;
    const pin = document.getElementById('regPin').value.trim();
    const errorEl = document.getElementById('regError');

    if (!full_name || !phone) { errorEl.textContent = 'Name and phone are required.'; return; }
    const needsPin = role === 'manager' || role === 'secretary';
    if (needsPin && !/^\d{4}$/.test(pin)) { errorEl.textContent = 'PIN must be exactly 4 digits.'; return; }

    const body = { shop_id: SHOP_ID, full_name, phone, role, photo_url: selectedPhotoData };
    if (needsPin) body.pin = pin;
    if (role === 'barber' || role === 'beautician') {
      const specialties = document.getElementById('regSpecialties').value.split(',').map(s => s.trim()).filter(Boolean);
      body.specialties = specialties;
      body.commission_rate = Number(document.getElementById('regCommission').value) || 40;
    }

    try {
      const res = await fetch(`${API_BASE}/staff`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      closeRegModal();
      loadStaff();
    } catch (err) {
      errorEl.textContent = err.message;
    }
  }

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  }

  async function loadLoginHistory() {
    const body = document.getElementById('loginHistoryBody');
    try {
      const res = await fetch(`${API_BASE}/auth/sessions?shop_id=${SHOP_ID}&limit=25`);
      const sessions = await res.json();
      if (!sessions.length) {
        body.innerHTML = `<tr><td colspan="4" class="lh-empty">No login activity recorded yet.</td></tr>`;
        return;
      }
      body.innerHTML = sessions.map(s => `
        <tr>
          <td>${escapeHtml(s.full_name)}</td>
          <td><span class="lh-role">${escapeHtml(s.role)}</span></td>
          <td class="lh-time">${fmtDateTime(s.login_at)}</td>
          <td>${s.logout_at ? `<span class="lh-time">${fmtDateTime(s.logout_at)}</span>` : `<span class="lh-active">● still logged in</span>`}</td>
        </tr>`).join('');
    } catch (err) {
      body.innerHTML = `<tr><td colspan="4" class="lh-empty">Couldn't load login history.</td></tr>`;
    }
  }

  // Both admin (owner) and manager can add staff — manager can add, not delete
  if (window.barberOSSession && ['owner', 'manager'].includes(window.barberOSSession.role)) {
    document.getElementById('addStaffBtn').style.display = 'inline-block';
  }

  loadStaff();

  // Login History is owner-only
  if (window.barberOSSession && window.barberOSSession.role === 'owner') {
    loadLoginHistory();
  } else {
    const card = document.getElementById('loginHistoryCard');
    if (card) card.style.display = 'none';
  }
</script>
</body>
</html>
