<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BarberOS — Customers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B1D; --ink-raised:#242426; --ink-line:#3A3936;
    --chalk:#F2ECDD; --chalk-dim:#B8B3A6;
    --barber-red:#C8352E; --barber-blue:#2C4A7C;
    --amber:#E8A33D; --amber-dim:#8A6428;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{display:grid;grid-template-columns:76px 1fr;min-height:100vh;}
  .rail{position:relative;background:repeating-linear-gradient(-45deg, var(--barber-red) 0 18px, var(--chalk) 18px 36px, var(--barber-blue) 36px 54px, var(--chalk) 54px 72px);background-size:200% 200%;animation:pole 14s linear infinite;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;}
  @keyframes pole{from{background-position:0 0;}to{background-position:0 220px;}}
  @media (prefers-reduced-motion: reduce){.rail{animation:none;}}
  .rail::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(27,27,29,.15), rgba(27,27,29,.55) 60%, rgba(27,27,29,.85));}
  .rail-logo{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ink);border:2px solid var(--chalk);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;margin-bottom:18px;flex-shrink:0;}
  .rail-nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .rail-item{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--chalk);cursor:pointer;text-decoration:none;transition:background .15s ease;}
  .rail-item:hover{background:rgba(27,27,29,.5);}
  .rail-item.active{background:var(--ink);box-shadow:0 0 0 1.5px var(--amber);}
  .logout-item{margin-top:10px;color:var(--barber-red);}
  .logout-item:hover{background:rgba(200,53,46,.15);}
  .rail-item svg{width:19px;height:19px;flex-shrink:0;}
  .rail-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-raised);border:1px solid var(--ink-line);color:var(--chalk);padding:12px 20px;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:100;}
  .rail-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  main{padding:28px 36px 60px;max-width:1100px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .shop-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;line-height:1;}
  .shop-sub{color:var(--chalk-dim);font-size:13px;margin-top:4px;}

  .search-box{
    width:100%;max-width:340px;background:var(--ink-raised);border:1px solid var(--ink-line);
    border-radius:10px;padding:11px 14px;color:var(--chalk);font-family:'Inter',sans-serif;
    font-size:14px;margin-bottom:20px;
  }
  .search-box::placeholder{color:var(--chalk-dim);}

  .cust-table{width:100%;border-collapse:collapse;}
  .cust-table th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--chalk-dim);font-weight:600;padding:0 14px 10px;
  }
  .cust-row{background:var(--ink-raised);border:1px solid var(--ink-line);cursor:pointer;}
  .cust-row td{padding:14px;font-size:13.5px;}
  .cust-row td:first-child{border-radius:12px 0 0 12px;}
  .cust-row td:last-child{border-radius:0 12px 12px 0;}
  .cust-row + .cust-row{border-top:none;}
  .row-spacer td{padding:3px;border:none;}
  .cust-name-cell{display:flex;align-items:center;gap:10px;font-weight:700;}
  .cust-avatar-sm{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg, var(--barber-red), var(--amber));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:11px;color:var(--ink);flex-shrink:0;}
  .cust-phone{color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .cust-points{font-family:'IBM Plex Mono',monospace;color:var(--amber);}

  .empty{text-align:center;padding:40px 10px;color:var(--chalk-dim);font-size:13px;}

  /* Detail drawer */
  .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;}
  .drawer-overlay.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;
    background:var(--ink-raised);border-left:1px solid var(--ink-line);
    padding:26px;overflow-y:auto;z-index:61;
  }
  .drawer-close{float:right;cursor:pointer;color:var(--chalk-dim);font-size:20px;}
  .drawer-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .drawer-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg, var(--barber-red), var(--amber));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--ink);flex-shrink:0;}
  .drawer-name{font-size:18px;font-weight:700;}
  .drawer-meta{font-size:12.5px;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;}
  .drawer-stats{display:flex;gap:20px;margin:18px 0;padding:14px 0;border-top:1px dashed var(--ink-line);border-bottom:1px dashed var(--ink-line);}
  .drawer-stat .n{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
  .drawer-stat .l{font-size:10.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.5px;}
  .visit-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);font-weight:600;margin-bottom:10px;}
  .visit-row{padding:10px 0;border-bottom:1px dashed var(--ink-line);font-size:13px;}
  .visit-row:last-child{border-bottom:none;}
  .visit-top{display:flex;justify-content:space-between;font-weight:600;}
  .visit-date{color:var(--chalk-dim);font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .visit-services{color:var(--chalk-dim);font-size:12px;margin-top:2px;}

  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr;}
    main{padding:22px 16px 50px;}
    .cust-table thead{display:none;}
    .cust-table, .cust-table tbody, .cust-row, .cust-row td{display:block;width:100%;}
    .cust-row{border-radius:12px;margin-bottom:10px;padding:6px;}
  }
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  @media (max-width:480px){
    .app{grid-template-columns:50px 1fr;}
    .rail-logo{width:32px;height:32px;font-size:12px;margin-bottom:12px;}
    .rail-item{width:36px;height:36px;}
    .rail-item svg{width:16px;height:16px;}
    main{padding:16px 12px 40px;}
    .shop-name{font-size:22px !important;}
    .shop-sub{font-size:11px;}
  }
</style>
</head>
<body>
<script src="utils.js"></script>
<script src="auth-guard.js"></script>
<div class="app">
  <nav class="rail" aria-label="Main navigation">
    <div class="rail-logo">BO</div>
    <div class="rail-nav">
      <a class="rail-item" href="dashboard.html" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
      <a class="rail-item" href="pos.html" title="POS / New Sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></a>
      <a class="rail-item" href="appointments.html" title="Appointments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a class="rail-item" href="queue.html" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="21" y2="6"/><circle cx="4" cy="12" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="12" x2="21" y2="12"/><circle cx="4" cy="18" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="18" x2="21" y2="18"/></svg></a>
      <a class="rail-item active" href="customers.html" title="Customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
      <a class="rail-item" href="staff.html" title="Staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M16 4.5c1.6.4 2.8 1.9 2.8 3.6 0 1.7-1.2 3.2-2.8 3.6"/><path d="M18.5 14.2c2.3.6 4 2.6 4 5"/></svg></a>
      <a class="rail-item" href="inventory.html" title="Inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg></a>
      <a class="rail-item" href="reports.html" title="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="14"/><line x1="21" y1="20" x2="21" y2="4"/></svg></a>
      <a class="rail-item" href="expenses.html" title="Expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg></a>
      <a class="rail-item" href="settings.html" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <div class="rail-item logout-item" title="Logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    </div>
  </nav>
  <div class="rail-toast" id="railToast"></div>

  <main>
    <div class="topbar">
      <div>
        <div class="shop-name">CUSTOMERS</div>
        <div class="shop-sub">Kinyozi Management System · visit history &amp; loyalty</div>
      </div>
    </div>

    <input class="search-box" id="searchBox" placeholder="Search by name or phone…">

    <table class="cust-table">
      <thead><tr><th>Customer</th><th>Phone</th><th>Loyalty Pts</th></tr></thead>
      <tbody id="custTableBody"></tbody>
    </table>
  </main>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <span class="drawer-close" onclick="closeDrawer()">✕</span>
    <div id="drawerContent">Loading…</div>
  </div>
</div>

<script>
  const SHOP_ID = '11111111-1111-1111-1111-111111111111';
  const API_BASE = window.location.origin + '/api';
  let allCustomers = [];

  function fmtKsh(n) { return 'KSh ' + Number(n).toLocaleString(); }
  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }

  function renderTable(customers) {
    const body = document.getElementById('custTableBody');
    if (!customers.length) {
      body.innerHTML = `<tr><td colspan="3" class="empty">No customers found.</td></tr>`;
      return;
    }
    body.innerHTML = customers.map(c => `
      <tr class="cust-row" onclick="openDrawer('${c.id}')">
        <td><div class="cust-name-cell"><div class="cust-avatar-sm">${initials(c.full_name)}</div>${escapeHtml(c.full_name)}</div></td>
        <td class="cust-phone">${escapeHtml(c.phone || '—')}</td>
        <td class="cust-points">${c.loyalty_points} pts</td>
      </tr>
      <tr class="row-spacer"><td colspan="3"></td></tr>
    `).join('');
  }

  async function loadCustomers(search) {
    const url = search
      ? `${API_BASE}/customers?shop_id=${SHOP_ID}&search=${encodeURIComponent(search)}`
      : `${API_BASE}/customers?shop_id=${SHOP_ID}`;
    const res = await fetch(url);
    allCustomers = await res.json();
    renderTable(allCustomers);
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    loadCustomers(e.target.value.trim());
  });

  async function openDrawer(id) {
    document.getElementById('drawerOverlay').classList.add('open');
    document.getElementById('drawerContent').innerHTML = 'Loading…';
    const res = await fetch(`${API_BASE}/customers/${id}`);
    const c = await res.json();

    const totalSpent = c.visits.reduce((sum, v) => sum + Number(v.total), 0);
    const visitsHTML = c.visits.length
      ? c.visits.map(v => `
        <div class="visit-row">
          <div class="visit-top"><span>${fmtKsh(v.total)}</span><span class="visit-date">${new Date(v.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' })}</span></div>
          <div class="visit-services">${escapeHtml((v.services || []).filter(Boolean).join(' + ') || 'Products only')} ${v.barber_name ? '· ' + escapeHtml(v.barber_name) : ''}</div>
        </div>`).join('')
      : `<div class="empty">No visits recorded yet.</div>`;

    document.getElementById('drawerContent').innerHTML = `
      <div class="drawer-header">
        <div class="drawer-avatar">${initials(c.full_name)}</div>
        <div>
          <div class="drawer-name">${escapeHtml(c.full_name)}</div>
          <div class="drawer-meta">${escapeHtml(c.phone || 'no phone on file')}</div>
        </div>
      </div>
      <div class="drawer-stats">
        <div class="drawer-stat"><div class="n">${c.visits.length}</div><div class="l">Visits</div></div>
        <div class="drawer-stat"><div class="n">${fmtKsh(totalSpent)}</div><div class="l">Lifetime Spend</div></div>
        <div class="drawer-stat"><div class="n">${c.loyalty_points}</div><div class="l">Loyalty Pts</div></div>
      </div>
      <div class="visit-title">Visit History</div>
      ${visitsHTML}
    `;
  }

  function closeDrawer(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('drawerOverlay').classList.remove('open');
  }

  let toastTimer;
  function comingSoon(feature) {
    const toast = document.getElementById('railToast');
    toast.textContent = `${feature} isn't built yet.`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  loadCustomers();
</script>
</body>
</html>
